name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------- 发布 4 个变体 ----------
      #   gui-sc    → 自包含单文件 exe（直传，不 zip）
      #   cli-sc    → 自包含单文件 exe（直传，不 zip）
      #   gui-fxdep / cli-fxdep → exe + dll 目录（打包成 zip）
      - name: Publish all variants
        run: make publish

      - name: Package fxdep
        run: make publish-package-fxdep

      # ---------- 生成哈希清单，供用户校验 ----------
      - name: Generate SHA256SUMS
        run: |
          cd build/publish
          sha256sum \
            gui-sc/BattleNetSwitcher.exe \
            cli-sc/BattleNetSwitcher.Cli.exe \
            BattleNetSwitcher-fxdep.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/publish/gui-sc/BattleNetSwitcher.exe
            build/publish/cli-sc/BattleNetSwitcher.Cli.exe
            build/publish/BattleNetSwitcher-fxdep.zip
            build/publish/SHA256SUMS.txt
          generate_release_notes: true
