name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------- 一次 make publish 产出 4 种变体 ----------
      # （gui-sc / cli-sc / gui-fxdep / cli-fxdep）
      - name: Publish all variants (make publish)
        run: make publish

      # ---------- 重命名 + 打包 ----------
      - name: Arrange files
        run: |
          mkdir -p ./out
          mv ./build/publish/gui-sc/BattleNetSwitcher.exe     ./out/BattleNetSwitcher.exe
          mv ./build/publish/cli-sc/BattleNetSwitcher.Cli.exe ./out/BattleNetSwitcher.Cli.exe
          cd ./build/publish && zip -r ../../out/BattleNetSwitcher-fxdep.zip gui-fxdep cli-fxdep
          cd ../..
          ls -la ./out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./out/BattleNetSwitcher.exe
            ./out/BattleNetSwitcher.Cli.exe
            ./out/BattleNetSwitcher-fxdep.zip
          generate_release_notes: true
